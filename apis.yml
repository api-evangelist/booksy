apis:
- aid: booksy:booksy-public-api
  name: Booksy Public API
  description: The Booksy Public API is a partner-facing REST API for managing Booksy
    businesses and their booking data. It is organized around resource-oriented URLs,
    returns JSON, uses standard HTTP verbs and status codes, and is versioned with
    an Accept header carrying "application/json; version=0.3". Partners authenticate with an
    RSA key pair (separate keys for sandbox and production), signing a short-lived
    RS256 JWT assertion that is exchanged at /token/ for a 5-minute access token and
    a 3-day refresh token. The documented surface covers 96 endpoints across business,
    business category, business amenities, business schedule, traveling-to-customer,
    region reverse geocoding, users, resources, resource photos, resource schedules,
    resource time off, services, service variants, service photos, service categories,
    consent forms, customers, appointments, appointment consents, appointment reviews
    and review statistics, plus an appointment webhook delivered to the partner.
  humanURL: https://docs.booksy.com/
  baseURL: https://us.booksy.com/public-api/us/
