aid: booksy
name: Booksy
description: Booksy is a beauty, wellness and health services platform that pairs a
  consumer appointment marketplace (booksy.com) with Booksy Biz, a subscription business-management
  application for salons, barbershops, spas, nail studios, tattoo artists, massage
  therapists and other independent service providers. The platform covers online booking,
  calendar and staff scheduling, client records, inventory, no-show protection, digital
  loyalty cards, marketing tools such as Boost, reviews, and integrated card payments
  including a Booksy Card Reader and Tap to Pay. Booksy also operates the Booksy Public
  API, a partner-facing REST API documented at docs.booksy.com that exposes businesses,
  business categories and amenities, business and staff schedules, resources (staff
  and appliances), services, service variants, service categories, service and staff
  photos, consent forms, customers, appointments and appointment status transitions,
  appointment consents, reviews and review statistics, plus an appointment webhook.
  The API is versioned through an Accept header, authenticates with partner-issued
  RSA key pairs exchanged for short-lived JWT access tokens, and is served per country
  from https://<country_code>.booksy.com/public-api/<country_code>/.
